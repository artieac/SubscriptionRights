services:
  backend:
    build:
      context: ./backend
    # All the backend's own SUBSCRIPTIONS_* settings (see backend/src/main/resources/application.yml)
    # are read from the container's environment -- env_file just forwards whatever is in .env.
    # Anything left unset there falls back to that file's own default-value.
    container_name: subscriptionentitlements-api
    hostname: subscriptionentitlements-api
    env_file:
      - .env
    ports:
      - "${SUBSCRIPTIONS_SERVER_PORT:-8087}:${SUBSCRIPTIONS_SERVER_PORT:-8087}"
    restart: unless-stopped
    networks:
      - nginx-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the built JS bundle at image-build time (Vite has no runtime config
        # mechanism) -- changing this means rebuilding the frontend image, not just restarting it.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: subscriptionentitlements-ui
    environment:
      PORT: ${SUBSCRIPTIONS_FRONTEND_HTTP_PORT:-5175}
    ports:
      - "${SUBSCRIPTIONS_FRONTEND_HTTP_PORT:-5175}:${SUBSCRIPTIONS_FRONTEND_HTTP_PORT:-5175}"
    restart: unless-stopped
    networks:
      - nginx-network
    depends_on:
      - backend

networks:
  nginx-network:
    external: true